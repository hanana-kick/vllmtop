name: autoselect-qwen35-smoke

on:
  push:
    branches:
      - autoselect-qwen35-smoke-20260930
    paths:
      - .github/workflows/autoselect-qwen35-smoke.yml

jobs:
  qwen35-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_XET_HIGH_PERFORMANCE: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TEST_REVISION: "prompt-variant-1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Create isolated uv environment
        run: uv venv .venv
      - name: Install CPU inference stack
        run: |
          uv pip install --python .venv/bin/python             --index-strategy unsafe-best-match             --index-url https://download.pytorch.org/whl/cpu             --extra-index-url https://pypi.org/simple             'torch==2.14.0+cpu'
          uv pip install --python .venv/bin/python             'transformers==5.17.0'             'huggingface_hub[hf_xet]>=1.0'             'accelerate>=1.0'             'safetensors>=0.7'
      - name: Compare current and exact-aware threshold prompts
        run: |
          .venv/bin/python _autoselect_test/prompt_variant_experiment.py 2>&1 | tee prompt-variant.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoselect-prompt-variant-evidence
          path: |
            prompt-variant-result.json
            prompt-variant.log
          if-no-files-found: warn
