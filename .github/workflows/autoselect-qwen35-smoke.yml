name: autoselect-global-calibration
on:
  push:
    branches: [autoselect-qwen35-smoke-20260930]
    paths: [.github/workflows/autoselect-qwen35-smoke.yml]
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_XET_HIGH_PERFORMANCE: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv .venv
      - run: |
          uv pip install --python .venv/bin/python --index-strategy unsafe-best-match --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple 'torch==2.14.0+cpu'
          uv pip install --python .venv/bin/python 'transformers==5.17.0' 'huggingface_hub[hf_xet]>=1.0' 'accelerate>=1.0' 'safetensors>=0.7' 'pytest>=8.4'
      - name: Unit tests
        run: PYTHONPATH=_autoselect_test/src .venv/bin/python -m pytest _autoselect_test/tests -q
      - name: Real Qwen integration
        run: .venv/bin/python _autoselect_test/global_calibration_integration.py | tee global-calibration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-calibration-production-evidence
          path: |
            global-calibration-result.json
            global-calibration.log
