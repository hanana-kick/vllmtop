name: autoselect-digit-regression-experiment

on:
  push:
    branches:
      - autoselect-qwen35-smoke-20260930
    paths:
      - .github/workflows/autoselect-qwen35-smoke.yml

jobs:
  qwen35-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_XET_HIGH_PERFORMANCE: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TEST_REVISION: "7"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv .venv
      - name: Install CPU inference stack
        run: |
          uv pip install --python .venv/bin/python             --index-strategy unsafe-best-match             --index-url https://download.pytorch.org/whl/cpu             --extra-index-url https://pypi.org/simple             'torch==2.14.0+cpu'
          uv pip install --python .venv/bin/python             'transformers==5.17.0'             'huggingface_hub[hf_xet]>=1.0'             'accelerate>=1.0'             'safetensors>=0.7'
      - name: Run digit regression experiment
        run: |
          .venv/bin/python digit_regression_experiment.py | tee digit-regression.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digit-regression-evidence
          path: |
            digit-regression-result.json
            digit-regression.log
          if-no-files-found: warn
