name: autoselect-qwen35-smoke

on:
  push:
    branches:
      - autoselect-qwen35-smoke-20260930
    paths:
      - .github/workflows/autoselect-qwen35-smoke.yml

jobs:
  bias-calibration-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_XET_HIGH_PERFORMANCE: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TEST_REVISION: "bias-calibration-1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv venv .venv
      - name: Install CPU inference stack
        run: |
          uv pip install --python .venv/bin/python \
            --index-strategy unsafe-best-match \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            'torch==2.14.0+cpu'
          uv pip install --python .venv/bin/python \
            'transformers==5.17.0' \
            'huggingface_hub[hf_xet]>=1.0' \
            'accelerate>=1.0' \
            'safetensors>=0.7'
      - name: Benchmark one-row token bias calibration
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/python _autoselect_test/bias_calibration_benchmark.py 2>&1 | tee bias-calibration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bias-calibration-benchmark
          path: |
            bias-calibration-benchmark.json
            bias-calibration.log
          if-no-files-found: warn
