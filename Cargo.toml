[package]
name = "vllmtop"
version = "0.1.2"
edition = "2021"
description = "btop-style TUI for vLLM via Docker logs"
license = "MIT"

[[bin]]
name = "vllmtop"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
anyhow = "1"
[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
